<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pizzly</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="shortcut icon" href="../assets/images/favicon.png" type="image/x-icon">
    
</head>
<body>
    <div class="login-container">

        <div class="login-left">
            <h1>Pizzly</h1>
            <p>Sabores que conquistam 🔥</p>
        </div>

        <div class="login-right">
            <div class="login-card">
                <h2>Bem-vindo</h2>
                <form action="admin.html">
                    <input type="email" name="email" placeholder="E-mail" required title="Digite um e-mail válido">
                    
                    <input type="password" name="senha" placeholder="Senha" required minlength="8">
            
                    <p>
                        <a href="#" class="link">Esqueci minha senha</a>
                    </p>
                    
            
                    <button type="submit">Entrar</button>
                    <p>
                        Não possui uma conta?
                        <a href="#" class="link">Cadastre-se</a>
                    </p>
                </form>
            </div>
        </div>

    </div>

    
    
</body>
</html>
